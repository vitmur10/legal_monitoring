services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: legal_monitoring
      POSTGRES_USER: legal_monitoring
      POSTGRES_PASSWORD: legal_monitoring
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_monitoring -d legal_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
